name: Build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore WebUntis.sln

      - name: Test core
        run: dotnet test tests/WebUntis.Core.Tests/WebUntis.Core.Tests.csproj -c Release --no-restore

      - name: Build and package
        run: dotnet publish src/WebUntis.App/WebUntis.App.csproj -c Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:AppxPackageSigningEnabled=false -p:GenerateAppxPackageOnBuild=true -bl:build.binlog

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: webuntis-msix
          path: src/WebUntis.App/**/*.msix
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.binlog
          if-no-files-found: ignore
