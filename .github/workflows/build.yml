name: Build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore WebUntis.sln

      - name: Test core
        run: dotnet test tests/WebUntis.Core.Tests/WebUntis.Core.Tests.csproj -c Release --no-restore

      - name: Sign and package
        shell: pwsh
        run: ./ci/sign-dev-package.ps1

      - name: Upload signed package and public certificate
        uses: actions/upload-artifact@v4
        with:
          name: webuntis-msix
          path: |
            artifacts/WebUntis.msix
            artifacts/WebUntis.cer
            artifacts/INSTALL.md
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.binlog
          if-no-files-found: ignore
